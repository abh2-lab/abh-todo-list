services:
  app:
    build: .
    # There is no "ports:" here on purpose. Coolify's proxy reaches the app inside Docker
    # and serves it on your domain with HTTPS. Publishing port 3000 would also open
    # http://<server-ip>:3000 to the whole internet, without HTTPS.
    # To try this file on your own computer, add this (it opens the port only to you):
    #   ports:
    #     - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
